  <!-- titik-titik kecil pengisi -->
  <g fill="#fdf3d6" opacity="0.6">
    <circle cx="440" cy="150" r="4"/>
    <circle cx="460" cy="190" r="3"/>
    <circle cx="420" cy="220" r="3"/>
