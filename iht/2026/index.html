      // WCAG Relative Luminance & Contrast Ratio Calculator
      const getLuminance = (r, g, b) => {
        const a = [r, g, b].map(v => {
          v /= 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        });
        return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
      };

      const hexToRgb = (hex) => {
        const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : { r: 0, g: 0, b: 0 };
      };

      const calculateContrastRatio = (color1Hex, color2Hex) => {
        const rgb1 = hexToRgb(color1Hex);
        const rgb2 = hexToRgb(color2Hex);
        const l1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
        const l2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);
        const lighter = Math.max(l1, l2);
        const darker = Math.min(l1, l2);
        return (lighter + 0.05) / (darker + 0.05);
      };

        const calculateSusScore = () => {
          let score = 0;
          susAnswers.forEach((val, idx) => {
            if ((idx + 1) % 2 !== 0) score += (val - 1);
            else score += (5 - val);
          });
          return Math.round(score * 2.5);
        };

        const calculateModuleQuiz = (modIdx) => {
          const modQuizzes = CURRICULUM[modIdx].quiz;

                        <div className="w-full flex justify-between items-center mb-3">
                          <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            <Icon name="Eye" className="w-3.5 h-3.5 text-blue-400" /> Canvas Preview Interaktif
                          </span>
                          <span className="text-[10px] text-slate-500 font-mono">
                            Viewport: {simViewport.toUpperCase()} ({simViewport === 'mobile' ? '375px' : simViewport === 'tablet' ? '768px' : '100%'})
                          </span>
                        </div>

                        <div 
                          className="transition-all duration-300 rounded-2xl overflow-hidden shadow-2xl border-4 border-slate-800 w-full"
                          style={{
                            maxWidth: simViewport === 'mobile' ? '360px' : simViewport === 'tablet' ? '600px' : '100%',
                            backgroundColor: simBgColor
                          }}
                        >
                          <div 
                            className="p-4 min-h-[420px] flex flex-col justify-between"
                            style={{ padding: `${simMargin}px` }}
                          >
                            <div className="space-y-4">
                              <div 
                                className="grid w-full text-center"
                                style={{ 
                                  gridTemplateColumns: `repeat(${simGridCols}, minmax(0, 1fr))`,
                                  gap: `${simGap}px` 
                                }}
                              >
                                {Array.from({ length: simGridCols }).map((_, idx) => (
                                  <div key={idx} className="bg-blue-500/10 border border-dashed border-blue-400/30 text-[9px] font-mono text-blue-400 rounded py-1">
                                    Col {idx + 1}
                                  </div>
                                ))}
                              </div>

                              <div 
                                className="rounded-xl p-5 shadow-md transition-all space-y-3"
                                style={{ 
                                  backgroundColor: simCardBg,
                                  color: simTextColor
                                }}
                              >
                                <div className="flex items-center gap-2">
                                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500" />
                                  <span className="text-[10px] uppercase font-bold tracking-wider opacity-70">
                                    UI Mockup Card
                                  </span>
                                </div>

                                <h4 
                                  className="transition-all leading-tight"
                                  style={{ 
                                    fontSize: `${1 * Math.pow(simTypeScale, 2)}rem`,
                                    fontWeight: simHeadingWeight
                                  }}
                                >
                                  Kantin Digital DKV
                                </h4>

                                <p 
                                  className="leading-relaxed opacity-90"
                                  style={{ fontSize: `${1 * simTypeScale * 0.75}rem` }}
                                >
                                  Pesan makanan tanpa antre dengan antarmuka presisi tinggi dan terstruktur secara intuitif.
                                </p>

                                <div className="pt-2">
                                  <button
                                    style={{ 
                                      backgroundColor: simPrimaryColor,
                                      color: '#FFFFFF',
                                      padding: simFixFlowFriction ? '12px 24px' : '4px 8px',
                                      fontSize: simFixFlowFriction ? '14px' : '10px'
                                    }}
                                    className="rounded-lg font-bold shadow-lg transition duration-200 w-full cursor-pointer"
                                  >
                                    {simFixFlowFriction ? 'Pesan Sekarang (Target Sentuh Ideal 48px)' : 'Pesan (Friction: Terlalu Kecil)'}
                                  </button>
                                </div>
                              </div>
                            </div>

                            <div className="mt-4 p-3 bg-slate-900/90 rounded-lg text-slate-300 text-[11px] space-y-1 font-mono border border-slate-800">
                              <div className="font-bold text-blue-400">Diagnostic UI Metrics:</div>
                              <div>• Text Contrast: <span className={Number(textContrast) >= 4.5 ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>{textContrast}:1</span></div>
                              <div>• Heading Size Ratio: <span className="text-amber-400 font-bold">{(1 * Math.pow(simTypeScale, 2)).toFixed(2)}rem</span></div>
                              <div>• UX Target Touch: <span className={simFixFlowFriction ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold'}>{simFixFlowFriction ? 'Pass (48px)' : 'Warning (<30px)'}</span></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 3: QUIZ HOTS */}
              {activeTab === 'quiz' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4 mb-6">
                      <div>
                        <h2 className="text-lg font-bold text-white flex items-center gap-2">
                          <Icon name="CheckCircle" className="w-5 h-5 text-emerald-400" /> Uji Kompetensi HOTS (High Order Thinking Skills)
                        </h2>
                        <p className="text-xs text-slate-400">
                          Modul Terpilih: <span className="text-blue-400 font-semibold">{CURRICULUM[currentModuleIdx].title}</span>
                        </p>
                      </div>

                      <div className="flex items-center gap-2">
                        {CURRICULUM.map((_, idx) => (
                          <button
                            key={idx}
                            onClick={() => { setCurrentModuleIdx(idx); setQuizAnswers({}); setQuizSubmitted(false); }}
                            className={`w-8 h-8 rounded-lg font-bold text-xs transition cursor-pointer ${currentModuleIdx === idx ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}
                          >
                            M{idx + 1}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-6">
                      {CURRICULUM[currentModuleIdx].quiz.map((q, qIndex) => (
                        <div key={q.id} className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-4">
                          <div className="flex items-start gap-3">
                            <span className="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                              {qIndex + 1}
                            </span>
                            <p className="text-sm font-semibold text-slate-200 leading-relaxed">
                              {q.question}
                            </p>
                          </div>

                          <div className="space-y-2 pl-9">
                            {q.options.map((opt, optIdx) => {
                              const isSelected = quizAnswers[q.id] === optIdx;
                              const isCorrect = q.correct === optIdx;
                              
                              let btnStyle = "bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700 cursor-pointer";
                              if (quizSubmitted) {
                                if (isCorrect) btnStyle = "bg-emerald-950/60 border-emerald-500/80 text-emerald-200 font-semibold";
                                else if (isSelected && !isCorrect) btnStyle = "bg-red-950/60 border-red-500/80 text-red-200";
                              } else if (isSelected) {
                                btnStyle = "bg-blue-900/40 border-blue-500 text-white font-semibold";
                              }

                              return (
                                <button
                                  key={optIdx}
                                  disabled={quizSubmitted}
                                  onClick={() => handleAnswerSelect(q.id, optIdx)}
                                  className={`w-full text-left p-3.5 rounded-xl border text-xs transition flex items-center justify-between ${btnStyle}`}
                                >
                                  <span>{String.fromCharCode(65 + optIdx)}. {opt}</span>
                                  {quizSubmitted && isCorrect && <Icon name="Check" className="w-4 h-4 text-emerald-400 shrink-0" />}
                                  {quizSubmitted && isSelected && !isCorrect && <Icon name="X" className="w-4 h-4 text-red-400 shrink-0" />}
                                </button>
                              );
                            })}
                          </div>

                          {quizSubmitted && (
                            <div className="ml-9 p-3 rounded-lg bg-blue-950/30 border border-blue-800/40 text-xs text-blue-300 space-y-1">
                              <div className="font-bold flex items-center gap-1.5 text-blue-400">
                                <Icon name="BookOpen" className="w-3.5 h-3.5" /> Pembahasan Analisis HOTS:
                              </div>
                              <p>{q.explanation}</p>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    <div className="mt-6 pt-4 border-t border-slate-800 flex flex-wrap items-center justify-between gap-4">
                      <button
                        disabled={quizSubmitted || Object.keys(quizAnswers).length < CURRICULUM[currentModuleIdx].quiz.length}
                        onClick={() => calculateModuleQuiz(currentModuleIdx)}
                        className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold px-6 py-2.5 rounded-xl text-xs shadow-lg shadow-emerald-600/20 transition flex items-center gap-2 cursor-pointer"
                      >
                        <Icon name="Send" className="w-4 h-4" /> Simpan & Kirim Jawaban Kuis
                      </button>

                      {quizSubmitted && (
                        <div className="flex items-center gap-3">
                          <span className="text-xs text-slate-400">Skor Modul {currentModuleIdx + 1}:</span>
                          <span className="text-lg font-bold text-emerald-400 bg-emerald-950/60 px-3 py-1 rounded-lg border border-emerald-500/30">
                            {moduleScores[`m${currentModuleIdx + 1}`]} / 100
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: AI MENTOR */}
              {activeTab === 'ai-mentor' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[600px]">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                      <div className="flex items-center gap-3">
                        <div className="p-2 bg-purple-600/20 text-purple-400 rounded-lg border border-purple-500/30">
                          <Icon name="Sparkles" className="w-5 h-5" />
                        </div>
                        <div>
                          <h2 className="text-base font-bold text-white">AI Design & Coding Mentor DKV</h2>
                          <p className="text-xs text-slate-400">Generasi Prompt UI, Analisis Kode HTML/CSS, & Kritik Design System</p>
                        </div>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-4 pr-2 scrollbar-thin">
                      {aiMessages.map((msg, idx) => (
                        <div key={idx} className={`flex gap-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                          {msg.sender === 'ai' && (
                            <div className="w-7 h-7 rounded-full bg-purple-600/20 border border-purple-500/40 text-purple-300 flex items-center justify-center shrink-0 text-xs font-bold">
                              AI
                            </div>
                          )}
                          <div className={`max-w-[80%] rounded-2xl p-4 text-xs leading-relaxed ${
                            msg.sender === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-slate-950 border border-slate-800 text-slate-200 rounded-tl-none'
                          }`}>
                            {msg.text}
                          </div>
                        </div>
                      ))}
                      {aiLoading && (
                        <div className="flex gap-2 items-center text-xs text-slate-500 italic">
                          <Icon name="RefreshCw" className="w-3.5 h-3.5 animate-spin text-purple-400" /> AI Mentor sedang menganalisis prinsip DKV...
                        </div>
                      )}
                    </div>

                    <form onSubmit={handleSendAiPrompt} className="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                      <input 
                        type="text"
                        value={inputPrompt}
                        onChange={e => setInputPrompt(e.target.value)}
                        placeholder="Tanyakan konsep UI/UX, masukan prompt HTML/Tailwind, atau analisis WCAG..."
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 transition"
                      />
                      <button
                        type="submit"
                        disabled={aiLoading}
                        className="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-4 py-2.5 rounded-xl text-xs shadow-lg shadow-purple-600/20 transition flex items-center gap-1.5 cursor-pointer"
                      >
                        <Icon name="Send" className="w-4 h-4" /> Kirim
                      </button>
                    </form>
                  </div>
                </div>
              )}

              {/* TAB 5: DATABASE */}
              {activeTab === 'database' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4 mb-6">
                      <div>
                        <h2 className="text-lg font-bold text-white flex items-center gap-2">
                          <Icon name="Database" className="w-5 h-5 text-indigo-400" /> Database Live Rekap Hasil Belajar Siswa
                        </h2>
                        <p className="text-xs text-slate-400">Pencatatan Nilai Kuis HOTS (M1-M4) & Skor Usability Simulator (SUS)</p>
                      </div>

                      <div className="flex items-center gap-3">
                        <span className="text-xs text-slate-400">Total Terdata: <strong className="text-white">{studentDb.length}</strong></span>
                        <button
                          onClick={exportToCSV}
                          className="flex items-center gap-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer"
                        >
                          <Icon name="Download" className="w-3.5 h-3.5" /> Unduh Rekap CSV
                        </button>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-300">
                        <thead className="bg-slate-950 text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-800">
                          <tr>
                            <th className="p-3">ID Siswa</th>
                            <th className="p-3">Nama Lengkap</th>
                            <th className="p-3">Kelas</th>
                            <th className="p-3">No. Absen</th>
                            <th className="p-3 text-center">M1</th>
                            <th className="p-3 text-center">M2</th>
                            <th className="p-3 text-center">M3</th>
                            <th className="p-3 text-center">M4</th>
                            <th className="p-3 text-center">Sim. SUS</th>
                            <th className="p-3 text-center">Rata-Rata Total</th>
                            <th className="p-3 text-center">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {studentDb.map((st) => (
                            <tr key={st.id} className="hover:bg-slate-800/40 transition">
                              <td className="p-3 font-mono text-slate-500">{st.id}</td>
                              <td className="p-3 font-semibold text-white">{st.name}</td>
                              <td className="p-3 text-slate-400">{st.class}</td>
                              <td className="p-3 text-slate-400 font-mono">{st.absent}</td>
                              <td className="p-3 text-center font-mono">{st.scoreM1 ?? '-'}</td>
                              <td className="p-3 text-center font-mono">{st.scoreM2 ?? '-'}</td>
                              <td className="p-3 text-center font-mono">{st.scoreM3 ?? '-'}</td>
                              <td className="p-3 text-center font-mono">{st.scoreM4 ?? '-'}</td>
                              <td className="p-3 text-center font-mono text-indigo-400">{st.susSimScore}</td>
                              <td className="p-3 text-center font-bold font-mono text-blue-400">{st.totalScore}</td>
                              <td className="p-3 text-center">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                                  st.status === 'Tuntas' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                }`}>
                                  {st.status}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>

            <footer className="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500">
              Media Pembelajaran Interaktif (MPI) DKV UI/UX • Kurikulum Merdeka Fase F SMK • PhET & AI Integration
            </footer>
          </div>
        );
      }

      // Render React App to DOM
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
