<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh menu horizontal</title>

  <style>
    .menu {
      list-style: none; /* Menghilangkan titik (bullet) */
      margin: 0;
      padding: 0;
      display: flex; /* Mengatur item anak menjadi sejajar horizontal */
      gap: 20px; /* Memberi jarak antarmenu */
    }
    
    /*Opsional: merapikan gaya tautan */
    .menu a {
      text-decoration: none;
      color: #333;
      padding: 8px 12px;
    }
    
    .menu a:hover {
      background-color: #f0f0f0;
      border-radius: 4px;
    }
  </style>

</head>
<body>

</ul>

</html>
