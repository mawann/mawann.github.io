// WCAG Relative Luminance & Contrast Ratio Calculator
const getLuminance = (r, g, b) => {
  const a = [r, g, b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
};

const hexToRgb = (hex) => {
  const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
  hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 0, g: 0, b: 0 };
};

const calculateContrastRatio = (color1Hex, color2Hex) => {
  const rgb1 = hexToRgb(color1Hex);
  const rgb2 = hexToRgb(color2Hex);
  const l1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
  const l2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
};

                      msg.sender === 'user' 
                        ? 'bg-blue-600 text-white rounded-tr-none' 
                        : 'bg-slate-950 border border-slate-800 text-slate-200 rounded-tl-none'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
                {aiLoading && (
                  <div className="flex gap-2 items-center text-xs text-slate-500 italic">
                    <RefreshCw className="w-3.5 h-3.5 animate-spin text-purple-400" /> AI Mentor sedang menganalisis prinsip DKV...
                  </div>
                )}
              </div>

              {/* Input Form */}
              <form onSubmit={handleSendAiPrompt} className="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                <input 
                  type="text"
                  value={inputPrompt}
                  onChange={e => setInputPrompt(e.target.value)}
                  placeholder="Tanyakan konsep UI/UX, masukan prompt HTML/Tailwind, atau analisis WCAG..."
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 transition"
                />
                <button
                  type="submit"
                  disabled={aiLoading}
                  className="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-4 py-2.5 rounded-xl text-xs shadow-lg shadow-purple-600/20 transition flex items-center gap-1.5"
                >
                  <Send className="w-4 h-4" /> Kirim
                </button>
              </form>
            </div>
          </div>
        )}

        {/* TAB 5: DATABASE & REKAP NILAI SISWA */}
        {activeTab === 'database' && (
          <div className="space-y-6">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4 mb-6">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Database className="w-5 h-5 text-indigo-400" /> Database Live Rekap Hasil Belajar Siswa
                  </h2>
                  <p className="text-xs text-slate-400">Pencatatan Nilai Kuis HOTS (M1-M4) & Skor Usability Simulator (SUS)</p>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">Total Siswa Terdata: <strong className="text-white">{studentDb.length}</strong></span>
                </div>
              </div>

              {/* Table */}
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-950 text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-800">
                    <tr>
                      <th className="p-3">ID Siswa</th>
                      <th className="p-3">Nama Lengkap</th>
                      <th className="p-3">Kelas</th>
                      <th className="p-3">No. Absen</th>
                      <th className="p-3 text-center">M1</th>
                      <th className="p-3 text-center">M2</th>
                      <th className="p-3 text-center">M3</th>
                      <th className="p-3 text-center">M4</th>
                      <th className="p-3 text-center">Sim. SUS</th>
                      <th className="p-3 text-center">Rata-Rata Total</th>
                      <th className="p-3 text-center">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {studentDb.map((st) => (
                      <tr key={st.id} className="hover:bg-slate-800/40 transition">
                        <td className="p-3 font-mono text-slate-500">{st.id}</td>
                        <td className="p-3 font-semibold text-white">{st.name}</td>
                        <td className="p-3 text-slate-400">{st.class}</td>
                        <td className="p-3 text-slate-400 font-mono">{st.absent}</td>
                        <td className="p-3 text-center font-mono">{st.scoreM1 ?? '-'}</td>
                        <td className="p-3 text-center font-mono">{st.scoreM2 ?? '-'}</td>
                        <td className="p-3 text-center font-mono">{st.scoreM3 ?? '-'}</td>
                        <td className="p-3 text-center font-mono">{st.scoreM4 ?? '-'}</td>
                        <td className="p-3 text-center font-mono text-indigo-400">{st.susSimScore}</td>
                        <td className="p-3 text-center font-bold font-mono text-blue-400">{st.totalScore}</td>
                        <td className="p-3 text-center">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                            st.status === 'Tuntas' 
                              ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                              : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                          }`}>
                            {st.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

      </main>

      {/* Footer */}
      <footer className="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500">
        Media Pembelajaran Interaktif (MPI) DKV UI/UX • Kurikulum Merdeka Fase F SMK • PhET & AI Integration
      </footer>
    </div>
  );
}
</script>
